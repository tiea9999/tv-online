<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIEA IPTV PRO FINAL</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: sans-serif;
        }

        #homeBtn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;
            padding: 10px;
            background: #00c853;
            border: none;
            border-radius: 10px;
            color: #fff;
        }

        .row-title {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            color: #00e5ff;
            font-weight: bold;
        }

        .seeall {
            background: #ff9800;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            color: #fff;
        }

        .row-items {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px;
        }

        .card {
            min-width: 150px;
            background: #111;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
        }

        .card:focus,
        .seeall:focus,
        #homeBtn:focus {
            outline: 3px solid #00e5ff;
            box-shadow: 0 0 18px #00e5ff;
        }

        img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        #overlay,
        #player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        #overlay {
            background: #000;
            z-index: 999;
            overflow: auto;
        }

        #player {
            background: #000;
            z-index: 1000;
            cursor: none;
        }

        #player.show-ui {
            cursor: default;
        }

        video,
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .player-ui {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1002;
            display: flex;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
        }

        #player.show-ui .player-ui {
            opacity: 1;
            pointer-events: auto;
        }

        .btn {
            padding: 12px 16px;
            background: #ff0000;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:focus {
            outline: 3px solid #00e5ff;
            box-shadow: 0 0 20px #00e5ff;
        }

        .player-hint {
            position: absolute;
            left: 12px;
            bottom: 12px;
            z-index: 1002;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(0, 0, 0, .65);
            color: #bdf6ff;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
        }

        #player.show-ui .player-hint {
            opacity: 1;
        }
    </style>
</head>

<body>

    <button id="homeBtn">🏠 HOME</button>

    <div id="grid"></div>
    <div id="overlay"></div>

    <div id="player">
        <div class="player-ui" id="playerUi">
            <button class="btn" id="closeBtn">✕</button>
        </div>
        <video id="video" playsinline autoplay></video>
        <iframe id="frame" allowfullscreen></iframe>
        <div class="player-hint">รีโมท: ◀ ย้อน 10 วิ • ▶ เดินหน้า 10 วิ • OK เต็มจอ • BACK ปิด</div>
    </div>

    <script>
        const PROXY = "https://iptv.tawatchai250958.workers.dev/?url=";

        const SOURCES = [
            {
name: "EZ 18+",
type: "json",
url: "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/Vip.json",
},
{
name: "njav 18+",
type: "json",
url: "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/njav.json",
},
{
name: "avpung 18+",
type: "json",
url: "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/playlist_avpung.json",
},
{
name: "jav24 18+",
type: "json",
url: "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/playlist_jav24.json",
},
{
name: "pornxxx",
type: "json",
url: "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/pornxxx.json",
},

        ];

        let grid = document.getElementById("grid");
        let overlay = document.getElementById("overlay");
        let video = document.getElementById("video");
        let frame = document.getElementById("frame");
        let player = document.getElementById("player");
        let closeBtn = document.getElementById("closeBtn");

        let hls = null;
        let store = {};
        let uiTimer = null;

        async function loadAll() {
            grid.innerHTML = "⚡ LOADING...";
            for (let s of SOURCES) {
                let data = await fetch(s.url).then(r => r.json());
                store[s.name] = { data, page: 1 };
                renderRow(s.name);
            }
        }

        function renderRow(name) {
            let row = document.createElement("div");
            row.innerHTML = `<div class="row-title">${name}
<button class="seeall" onclick="seeAll('${name}')">ดูทั้งหมด</button>
</div>
<div class="row-items" id="row-${name}"></div>`;
            grid.appendChild(row);
            renderPage(name);
        }

        function renderPage(name) {
            let obj = store[name];
            let row = document.getElementById("row-" + name);
            let items = obj.data.slice(0, obj.page * 20);
            row.innerHTML = "";
            items.forEach(item => {
                let div = document.createElement("div");
                div.className = "card";
                div.tabIndex = 0;
                div.innerHTML = `<img src="${item.image || item.poster || ''}"><div>${item.title || item.name || ""}</div>`;
                div.onclick = () => openItem(item);
                div.onkeydown = (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        openItem(item);
                    }
                };
                row.appendChild(div);
            });
        }

        function seeAll(name) {
            store[name].page++;
            renderPage(name);
        }

        function openItem(item) {
            if (item.episodes) {
                showEP(item);
                return;
            }
            startPlay([{ url: item.url || item.stream || item.link }]);
        }

        function showEP(item) {
            overlay.style.display = "block";
            grid.style.display = "none";

            overlay.innerHTML = `<h2 style="padding:10px">${item.title}</h2>
<div id="epBox" style="display:flex;flex-wrap:wrap;gap:10px;padding:10px"></div>`;

            let box = document.getElementById("epBox");

            item.episodes.forEach((ep, index) => {
                let d = document.createElement("div");
                d.className = "card";
                d.tabIndex = 0;
                d.textContent = ep.name || ep.title || ("EP" + (index + 1));
                d.onclick = () => startPlay(ep.servers || [{ url: ep.url || ep.stream || ep.link }]);
                d.onkeydown = (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        startPlay(ep.servers || [{ url: ep.url || ep.stream || ep.link }]);
                    }
                };
                box.appendChild(d);
            });

            setTimeout(() => box.querySelector(".card")?.focus(), 100);
        }

        function showPlayerUI() {
            player.classList.add("show-ui");
            clearTimeout(uiTimer);
            setTimeout(() => closeBtn.focus(), 50);
            uiTimer = setTimeout(() => {
                player.classList.remove("show-ui");
            }, 3000);
        }

        function requestFull() {
            try {
                if (player.requestFullscreen) player.requestFullscreen();
                else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
            } catch (e) {}
        }

        function closePlayer() {
            if (hls) {
                try { hls.destroy(); } catch (e) {}
                hls = null;
            }

            video.pause();
            video.removeAttribute("src");
            video.load();
            frame.src = "";

            player.style.display = "none";
            player.classList.remove("show-ui");

            try {
                if (document.fullscreenElement) document.exitFullscreen();
                else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
            } catch (e) {}

            grid.style.display = "block";
            overlay.style.display = "none";
        }

        function startPlay(list) {
            overlay.style.display = "none";
            player.style.display = "block";
            showPlayerUI();
            requestFull();
            playServers([...list]);
        }

        async function playServers(list) {
            for (let i = 0; i < list.length; i++) {
                let u = list[i].url || list[i].stream || list[i].link || list[i].file;
                if (!u) continue;

                try {
                    await Promise.race([
                        play(u),
                        new Promise((_, rej) => setTimeout(() => rej("timeout"), 8000))
                    ]);
                    return;
                } catch (e) {}
            }
            alert("❌ เล่นไม่ได้ทุก server");
        }

        function shouldUseProxy(url) {
            let u = String(url || "").toLowerCase();
            if (u.includes(".mpd")) return false;
            if (u.includes("thaicdn")) return false;
            if (u.includes("mux.dev")) return false;
            return true;
        }

        async function play(url) {
            if (hls) {
                hls.destroy();
                hls = null;
            }

            video.pause();
            video.removeAttribute("src");
            video.load();
            frame.src = "";

            video.style.display = "none";
            frame.style.display = "none";

            const lower = String(url).toLowerCase();
            const purl = shouldUseProxy(url) ? PROXY + encodeURIComponent(url) : url;

            if (lower.includes(".txt") || lower.includes(".m3u8")) {
                video.style.display = "block";

                if (Hls.isSupported()) {
                    hls = new Hls({
                        enableWorker: false,
                        lowLatencyMode: false,
                        maxBufferLength: 30,
                        maxMaxBufferLength: 60,
                        backBufferLength: 15,
                        fragLoadingMaxRetry: 3,
                        manifestLoadingMaxRetry: 2,
                        levelLoadingMaxRetry: 2
                    });

                    hls.loadSource(purl);
                    hls.attachMedia(video);

                    return new Promise((res, rej) => {
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            video.muted = false;
                            video.volume = 1;
                            video.play().then(res).catch(res);
                        });

                        hls.on(Hls.Events.ERROR, (e, d) => {
                            if (d.fatal) {
                                try { hls.destroy(); } catch (err) {}
                                rej();
                            }
                        });
                    });
                } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                    video.src = purl;
                    return video.play();
                }
            }

            if (lower.includes(".mp4") || lower.includes(".webm") || lower.includes(".mov")) {
                video.style.display = "block";
                video.src = url;
                video.muted = false;
                video.volume = 1;
                return video.play();
            }

            frame.style.display = "block";
            frame.src = url;
            return Promise.resolve();
        }

        function goHome() {
            window.location.href = "https://tiea9999.github.io/tv-online/index.html";
        }

        closeBtn.onclick = closePlayer;
        document.getElementById("homeBtn").onclick = goHome;

        player.addEventListener("mousemove", showPlayerUI);
        player.addEventListener("click", showPlayerUI);
        player.addEventListener("touchstart", showPlayerUI);

        document.addEventListener("keydown", e => {
            if (player.style.display === "block") {
                showPlayerUI();

                if (e.key === "ArrowRight") {
                    e.preventDefault();
                    if (video.style.display !== "none") video.currentTime += 10;
                }

                if (e.key === "ArrowLeft") {
                    e.preventDefault();
                    if (video.style.display !== "none") video.currentTime = Math.max(0, video.currentTime - 10);
                }

                if (e.key === "Enter" || e.key === "OK") {
                    e.preventDefault();
                    requestFull();
                }

                if (e.key === "Escape" || e.key === "Backspace" || e.keyCode === 10009) {
                    e.preventDefault();
                    closePlayer();
                }

                return;
            }

            if ((e.key === "Escape" || e.key === "Backspace" || e.keyCode === 10009) && overlay.style.display === "block") {
                e.preventDefault();
                overlay.style.display = "none";
                grid.style.display = "block";
            }
        });

        loadAll();
    </script>

</body>

</html>
