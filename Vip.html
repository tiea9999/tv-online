    <script>
        const PROXY = "https://iptv.tawatchai250958.workers.dev/?url=";

        const SOURCES = [

            url: "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/Vip.json",

            {

            },

            type: "json",
            url: "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/playlist_jav24.json",
            },
            {
            name: "pornxxx",
            type: "json",
            url: "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/pornxxx.json",
            },
       ];

        const FALLBACK_IMG =
            "data:image/svg+xml;utf8," +
            encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" width="300" height="450">
                    <rect width="100%" height="100%" fill="#1a1a1a"/>
                    <text x="50%" y="50%" fill="#ffffff" font-size="22" text-anchor="middle" dy=".3em">NO IMAGE</text>
                </svg>
            `);

        let grid = document.getElementById("grid");
        let overlay = document.getElementById("overlay");
        let video = document.getElementById("video");
        let frame = document.getElementById("frame");
        let player = document.getElementById("player");

        let hls = null;
        let store = {};

        let allView = {
            active: false,
            name: "",
            page: 1
        };

        let currentList = [];
        let currentIndex = 0;
        let currentPlayUrl = "";
        let lastView = { type: "grid", item: null };
        let controlTimer = null;

        function safeId(text) {
            return String(text).replace(/[^\wก-๙-]/g, "_");
        }

        function getTitle(item) {
            return item.title || item.name || item.ep_name || "ไม่มีชื่อ";
        }

        function getImage(item) {
            return (
                item.image ||
                item.poster ||
                item.poster_url ||
                item.thumb ||
                item.thumbnail ||
                item.logo ||
                FALLBACK_IMG
            );
        }

        function getDirectUrl(item) {
            if (!item || typeof item !== "object") return "";
            return (
                item.url ||
                item.file ||
                item.src ||
                item.link ||
                item.stream ||
                item.play ||
                item.video ||
                item.video_url ||
                item.m3u8 ||
                item.player ||
                item.embed ||
                item.stream_url ||
                ""
            );
        }

        function normalizeServers(servers) {
            if (!Array.isArray(servers)) return [];

            return servers
                .map(s => {
                    if (typeof s === "string") return { url: s };

                    if (s && typeof s === "object") {
                        return {
                            url:
                                s.url ||
                                s.file ||
                                s.src ||
                                s.link ||
                                s.stream ||
                                s.play ||
                                s.video ||
                                s.video_url ||
                                s.m3u8 ||
                                s.player ||
                                s.embed ||
                                s.stream_url ||
                                ""
                        };
                    }

                    return { url: "" };
                })
                .filter(s => s.url);
        }

        async function loadAll() {
            grid.innerHTML = `<div class="status">⚡ LOADING...</div>`;
            const rows = [];

            for (const s of SOURCES) {
                try {
                    const res = await fetch(s.url + "?t=" + Date.now(), { cache: "no-store" });
                    if (!res.ok) throw new Error("โหลดไม่สำเร็จ " + res.status);

                    const data = await res.json();

                    let list = [];
                    if (Array.isArray(data)) {
                        list = data;
                    } else if (Array.isArray(data.items)) {
                        list = data.items;
                    } else if (Array.isArray(data.data)) {
                        list = data.data;
                    }

                    store[s.name] = {
                        data: list,
                        page: 1,
                        error: ""
                    };
                } catch (err) {
                    console.error("โหลด source ไม่ได้:", s.name, err);
                    store[s.name] = {
                        data: [],
                        page: 1,
                        error: "โหลดรายการไม่ได้"
                    };
                }

                rows.push(s.name);
            }

            grid.innerHTML = "";
            rows.forEach(renderRow);
        }

        function renderRow(name) {
            const rowId = safeId(name);
            const row = document.createElement("div");

            row.innerHTML = `
                <div class="row-title">
                    <span>${name}</span>
                    <button class="seeall" onclick="seeAll('${name.replace(/'/g, "\\'")}')">ดูทั้งหมด</button>
                </div>
                <div class="row-items" id="row-${rowId}"></div>
            `;

            grid.appendChild(row);
            renderPage(name);
        }

        function createCard(item, onClick) {
            const div = document.createElement("div");
            div.className = "card";
            div.tabIndex = 0;

            const img = getImage(item);
            const title = getTitle(item);

            div.innerHTML = `
                <img
                    src="${img}"
                    alt="${title}"
                    loading="lazy"
                    referrerpolicy="no-referrer"
                    onerror="this.onerror=null;this.src='${FALLBACK_IMG}'"
                >
                <div class="card-title">${title}</div>
            `;

            div.onclick = onClick;
            div.onkeydown = (e) => {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    onClick();
                }
            };
            return div;
        }

        function renderPage(name) {
            const obj = store[name];
            if (!obj) return;

            const row = document.getElementById("row-" + safeId(name));
            if (!row) return;

            const items = obj.data.slice(0, 15);
            row.innerHTML = "";

            if (obj.error) {
                row.innerHTML = `<div class="status">❌ ${obj.error}</div>`;
                return;
            }

            if (!items.length) {
                row.innerHTML = `<div class="status">ไม่มีข้อมูล</div>`;
                return;
            }

            items.forEach(item => row.appendChild(createCard(item, () => openItem(item))));
        }

        function seeAll(name) {
            allView.active = true;
            allView.name = name;
            allView.page = 1;
            renderAllPage();
        }

        function renderAllPage() {
            const obj = store[allView.name];
            if (!obj) return;

            const perPage = 20;
            const totalItems = obj.data.length;
            const totalPages = Math.max(1, Math.ceil(totalItems / perPage));
            const currentPage = Math.min(allView.page, totalPages);
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const items = obj.data.slice(start, end);

            overlay.style.display = "block";
            grid.style.display = "none";

            overlay.innerHTML = `
                <div style="padding:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                    <h2 style="margin:0;">${allView.name}</h2>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="seeall" onclick="prevAllPage()">◀ ก่อนหน้า</button>
                        <button class="seeall" onclick="nextAllPage()">ถัดไป ▶</button>
                        <button class="seeall" onclick="backToGrid()">← กลับ</button>
                    </div>
                </div>

                <div style="padding:0 10px 10px 10px;color:#00e5ff;">
                    หน้า ${currentPage} / ${totalPages} &nbsp; | &nbsp; ทั้งหมด ${totalItems} เรื่อง
                </div>

                <div id="allBox" class="all-grid"></div>
            `;

            const box = document.getElementById("allBox");

            if (obj.error) {
                box.innerHTML = `<div class="status">❌ ${obj.error}</div>`;
                return;
            }

            if (!items.length) {
                box.innerHTML = `<div class="status">ไม่มีข้อมูล</div>`;
                return;
            }

            items.forEach(item => box.appendChild(createCard(item, () => openItem(item))));
        }

        function nextAllPage() {
            const obj = store[allView.name];
            if (!obj) return;

            const totalPages = Math.max(1, Math.ceil(obj.data.length / 20));
            if (allView.page < totalPages) {
                allView.page++;
                renderAllPage();
            }
        }

        function prevAllPage() {
            if (allView.page > 1) {
                allView.page--;
                renderAllPage();
            }
        }

        function openItem(item) {
            if (Array.isArray(item.episodes) && item.episodes.length) {
                showEP(item);
                return;
            }

            const servers = normalizeServers(item.servers || item.sources || item.links || []);
            const url = getDirectUrl(item);

            if (servers.length) {
                startPlay(servers);
                return;
            }

            if (url) {
                startPlay([{ url }]);
                return;
            }

            alert("❌ ไม่พบลิงก์เล่น");
        }

        function showEP(item) {
            lastView = { type: "ep", item };
            overlay.style.display = "block";
            grid.style.display = "none";

            overlay.innerHTML = `
                <div style="padding:10px;display:flex;align-items:center;justify-content:space-between;">
                    <h2 style="margin:0;">${getTitle(item)}</h2>
                    <button class="seeall" onclick="backToListOrGrid()">← กลับ</button>
                </div>
                <div class="ep-wrap" id="epBox"></div>
            `;

            const box = document.getElementById("epBox");

            item.episodes.forEach((ep, index) => {
                const d = document.createElement("div");
                d.className = "ep-card";
                d.tabIndex = 0;
                d.textContent = ep.name || ep.title || `EP ${index + 1}`;
                const playThisEp = () => {
                    lastView = { type: "ep", item };
                    const servers = normalizeServers(
                        ep.servers || ep.sources || ep.links || ep.files || ep.playlist || []
                    );

                    const single = getDirectUrl(ep);

                    if (servers.length) {
                        startPlay(servers);
                    } else if (single) {
                        startPlay([{ url: single }]);
                    } else {
                        alert("❌ ตอนนี้ไม่มีลิงก์เล่น");
                    }
                };
                d.onclick = playThisEp;
                d.onkeydown = (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        playThisEp();
                    }
                };
                box.appendChild(d);
            });
        }

        function startPlay(list) {
            currentList = [...list];
            currentIndex = 0;
            overlay.style.display = "none";
            player.style.display = "block";
            showPlayerControls();
            playServers(currentList);
        }

        async function playServers(list) {
            currentList = [...list];

            for (let i = 0; i < list.length; i++) {
                currentIndex = i;
                const item = list[i];
                const url = typeof item === "string" ? item : item.url;

                if (!url) continue;

                try {
                    await play(url);
                    return;
                } catch (e) {
                    console.warn("server เล่นไม่ได้:", url, e);
                }
            }

            autoOpenDeviceThenMx();
        }

        function cleanupPlayers() {
            if (hls) {
                try { hls.destroy(); } catch (e) { }
                hls = null;
            }

            video.pause();
            video.muted = true;
            video.removeAttribute("src");
            video.load();

            frame.src = "";
            video.style.display = "none";
            frame.style.display = "none";
        }

        function isHls(url) {
            return /\.m3u8($|\?)/i.test(url);
        }

        function isVideoFile(url) {
            return /\.(mp4|m4v|webm|ogg|ogv|mov)($|\?)/i.test(url);
        }

        function isEmbeddable(url) {
            return /youtube\.com|youtu\.be|vk\.com|ok\.ru|dailymotion\.com|player|embed/i.test(url);
        }

        function isProxyUrl(url) {
            return String(url || "").startsWith(PROXY);
        }

        function proxiedUrl(url) {
            if (!url || isProxyUrl(url)) return url;
            return PROXY + encodeURIComponent(url);
        }

        function needsMoreTime(url) {
            return /ok-hd\.com/i.test(String(url || ""));
        }

        async function play(url) {
            currentPlayUrl = url;
            cleanupPlayers();

            if (isHls(url)) {
                await playHlsWithFallback(url);
                return;
            }

            if (isVideoFile(url)) {
                return playNativeVideo(url);
            }

            if (isEmbeddable(url)) {
                return openFrame(url);
            }

            try {
                await playNativeVideo(url);
                return;
            } catch (_) {
                return openFrame(url);
            }
        }

        function playNativeVideo(url) {
            video.style.display = "block";
            frame.style.display = "none";

            return new Promise((resolve, reject) => {
                let done = false;

                const ok = () => {
                    if (done) return;
                    done = true;
                    clear();
                    video.muted = false;
                    const p = video.play();
                    if (p && typeof p.then === "function") {
                        p.then(() => resolve()).catch(() => resolve());
                    } else {
                        resolve();
                    }
                };

                const fail = () => {
                    if (done) return;
                    done = true;
                    clear();
                    reject("video error");
                };

                const clear = () => {
                    video.removeEventListener("loadedmetadata", ok);
                    video.removeEventListener("canplay", ok);
                    video.removeEventListener("playing", ok);
                    video.removeEventListener("error", fail);
                };

                video.addEventListener("loadedmetadata", ok, { once: true });
                video.addEventListener("canplay", ok, { once: true });
                video.addEventListener("playing", ok, { once: true });
                video.addEventListener("error", fail, { once: true });

                video.pause();
                video.removeAttribute("src");
                video.load();

                video.src = url;
                video.load();

                setTimeout(() => {
                    if (!done) fail();
                }, needsMoreTime(url) ? 3500 : 4500);
            });
        }

        function playHlsWithFallback(url) {
            const tryUrls = [url, proxiedUrl(url)];
            const uniqueUrls = [...new Set(tryUrls.filter(Boolean))];

            return new Promise(async (resolve, reject) => {
                let lastError = "hls fail";

                for (const testUrl of uniqueUrls) {
                    try {
                        currentPlayUrl = isProxyUrl(testUrl) ? url : testUrl;
                        await playOneHls(testUrl, needsMoreTime(url) ? 3500 : 4500);
                        resolve();
                        return;
                    } catch (e) {
                        lastError = e;
                        console.warn("HLS ล้มเหลว:", testUrl, e);
                    }
                }

                reject(lastError);
            });
        }

        function playOneHls(sourceUrl, timeoutMs = 4500) {
            video.style.display = "block";
            frame.style.display = "none";

            return new Promise((resolve, reject) => {
                let settled = false;

                const startVideo = () => {
                    try {
                        video.muted = true;
                        const p = video.play();
                        if (p && typeof p.catch === "function") p.catch(() => {});
                    } catch (e) {}
                };

                const ok = () => {
                    if (settled) return;
                    settled = true;
                    clear();

                    setTimeout(() => {
                        video.muted = false;
                        const p = video.play();
                        if (p && typeof p.then === "function") {
                            p.then(() => resolve()).catch(() => resolve());
                        } else {
                            resolve();
                        }
                    }, 200);
                };

                const fail = () => {
                    if (settled) return;
                    settled = true;
                    clear();
                    reject("hls error");
                };

                const clear = () => {
                    video.removeEventListener("loadedmetadata", ok);
                    video.removeEventListener("canplay", ok);
                    video.removeEventListener("playing", ok);
                    video.removeEventListener("error", fail);

                    if (hls) {
                        hls.off(Hls.Events.MANIFEST_PARSED, startVideo);
                        
                        hls.off(Hls.Events.ERROR, onHlsError);
                    }
                };

                const onHlsError = (event, data) => {
                    if (!data) return;

                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            try { hls.startLoad(); } catch (e) { }
                        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            try { hls.recoverMediaError(); } catch (e) { }
                        } else {
                            fail();
                        }
                    }
                };

                video.pause();
                video.removeAttribute("src");
                video.load();

                if (video.canPlayType("application/vnd.apple.mpegurl")) {
                    video.addEventListener("loadedmetadata", ok, { once: true });
                    video.addEventListener("canplay", ok, { once: true });
                    video.addEventListener("playing", ok, { once: true });
                    video.addEventListener("error", fail, { once: true });

                    video.src = sourceUrl;
                    video.load();
                } else if (Hls.isSupported()) {
                    hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: false,
                        backBufferLength: 30,
                        maxBufferLength: 20,
                        maxMaxBufferLength: 30,
                        startLevel: -1,
                        fragLoadingTimeOut: 20000,
                        manifestLoadingTimeOut: 20000
                    });

                    video.addEventListener("loadedmetadata", ok, { once: true });
                    video.addEventListener("canplay", ok, { once: true });
                    video.addEventListener("playing", ok, { once: true });
                    video.addEventListener("error", fail, { once: true });

                    hls.on(Hls.Events.MANIFEST_PARSED, startVideo);
                    hls.on(Hls.Events.ERROR, onHlsError);

                    hls.loadSource(sourceUrl);
                    hls.attachMedia(video);
                } else {
                    reject("browser not support hls");
                    return;
                }

                setTimeout(() => {
                    if (!settled) fail();
                }, timeoutMs);
            });
        }

        function openFrame(url) {
            frame.style.display = "block";

            return new Promise((resolve, reject) => {
                let done = false;

                const ok = () => {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    resolve();
                };

                const fail = () => {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    reject("iframe error");
                };

                frame.onload = ok;
                frame.onerror = fail;
                frame.src = url;

                const timer = setTimeout(() => {
                    if (!done) ok();
                }, 2500);
            });
        }

        function getActivePlayUrl() {
            const item = currentList[currentIndex] || {};
            return currentPlayUrl || (typeof item === "string" ? item : item.url) || "";
        }

        function buildIntent(url, type, packageName) {
            const scheme = url.startsWith("https://") ? "https" : "http";
            const clean = url.replace(/^https?:\/\//, "");
            const fallback = encodeURIComponent(url);
            const pkg = packageName ? `package=${packageName};` : "";
            return `intent://${clean}#Intent;scheme=${scheme};action=android.intent.action.VIEW;${pkg}type=${type};S.browser_fallback_url=${fallback};end`;
        }

        function openExternal() {
            const url = getActivePlayUrl();
            if (!url) return;

            const type = isHls(url) ? "application/x-mpegURL" : "video/*";
            const mxFree = buildIntent(url, type, "com.mxtech.videoplayer.ad");
            const mxPro = buildIntent(url, type, "com.mxtech.videoplayer.pro");

            window.location.href = mxFree;
            setTimeout(() => { window.location.href = mxPro; }, 900);
        }


        function openDevicePlayer() {
            const url = getActivePlayUrl();
            if (!url) return;

            const type = isHls(url) ? "application/x-mpegURL" : "video/*";
            const systemIntent = buildIntent(url, type, "");

            window.location.href = systemIntent;
            setTimeout(() => { window.location.href = url; }, 1200);
        }

        function autoOpenDeviceThenMx() {
            showPlayerControls();
            const hint = document.getElementById("mxHint");
            if (hint) hint.textContent = "เว็บเล่นไม่ได้ กำลังเปิด PLAYER ของเครื่อง ถ้าไม่เด้งให้กด ▶ PLAYER หรือ ▶ MX";
            openDevicePlayer();
            setTimeout(() => openExternal(), 2200);
        }

        function seekVideo(sec) {
            showPlayerControls();
            if (!video || video.style.display === "none") return;
            if (!Number.isFinite(video.duration)) return;
            const next = Math.max(0, Math.min(video.duration, (video.currentTime || 0) + sec));
            video.currentTime = next;
        }

        function showPlayerControls() {
            player.classList.add("show-controls");
            clearTimeout(controlTimer);
            controlTimer = setTimeout(() => {
                player.classList.remove("show-controls");
            }, 4500);
        }

        function closePlayerToLastView() {
            cleanupPlayers();
            player.style.display = "none";

            if (lastView.type === "ep" && lastView.item) {
                showEP(lastView.item);
                return;
            }

            if (allView.active) {
                renderAllPage();
                return;
            }

            overlay.style.display = "none";
            grid.style.display = "block";
        }

        async function copyCurrentLink() {
            if (!currentList.length) return;
            const item = currentList[currentIndex] || {};
            const url = currentPlayUrl || (typeof item === "string" ? item : item.url);
            if (!url) return;

            try {
                await navigator.clipboard.writeText(url);
                alert("คัดลอกลิงก์แล้ว");
            } catch (e) {
                prompt("คัดลอกลิงก์นี้", url);
            }
        }

        function backToListOrGrid() {
            if (allView.active) {
                renderAllPage();
            } else {
                backToGrid();
            }
        }

        function backToGrid() {
            overlay.style.display = "none";
            overlay.innerHTML = "";
            grid.style.display = "block";
            allView.active = false;
            allView.name = "";
            allView.page = 1;
        }

        function goHome() {
            window.location.href = "https://tiea9999.github.io/tv/";
        }

        player.addEventListener("mousemove", showPlayerControls);
        player.addEventListener("click", showPlayerControls);
        player.addEventListener("keydown", showPlayerControls);

        document.addEventListener("keydown", (e) => {
            if (player.style.display !== "block") return;

            if (e.key === "ArrowLeft") {
                e.preventDefault();
                seekVideo(-15);
            } else if (e.key === "ArrowRight") {
                e.preventDefault();
                seekVideo(15);
            } else if (e.key === "Escape" || e.key === "Backspace") {
                e.preventDefault();
                closePlayerToLastView();
            } else {
                showPlayerControls();
            }
        });


        loadAll();
    </script>

</body>

</html>
