<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIEA IPTV PROJECTOR OKHD FIX</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden
        }

        .row-title {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #00e5ff;
            font-weight: bold;
            font-size: 18px
        }

        .seeall {
            background: #ff9800;
            border: 0;
            padding: 8px 12px;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer
        }

        .row-items {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 10px
        }

        .card {
            min-width: 160px;
            max-width: 160px;
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            flex-shrink: 0;
            color: #fff
        }

        .card:focus,
        .seeall:focus,
        .ep-card:focus,
        .pbtn:focus {
            outline: 3px solid #00e5ff;
            box-shadow: 0 0 18px #00e5ff
        }

        .card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            border-radius: 8px;
            background: #222;
            display: block
        }

        .card-title {
            margin-top: 8px;
            font-size: 14px;
            line-height: 1.35;
            word-break: break-word
        }

        .status {
            padding: 14px;
            color: #bdf6ff
        }

        #overlay,
        #player {
            position: fixed;
            inset: 0;
            display: none
        }

        #overlay {
            background: #000;
            z-index: 999;
            overflow: auto;
            padding-top: 50px
        }

        #player {
            background: #000;
            z-index: 1000
        }

        video,
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
            object-fit: contain
        }

        #frame {
            display: none
        }

        .player-top {
            position: absolute;
            left: 8px;
            right: 8px;
            top: 8px;
            z-index: 1005;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            opacity: 0;
            pointer-events: none;
            transition: .2s
        }

        #player.show-controls .player-top {
            opacity: 1;
            pointer-events: auto
        }

        .leftBtns,
        .rightBtns {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .pbtn {
            background: rgba(0, 0, 0, .65);
            border: 2px solid #fff;
            color: #fff;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            text-shadow: 0 1px 2px #000
        }

        .pbtn.close {
            background: rgba(120, 0, 0, .75)
        }

        .pbtn.home {
            background: rgba(0, 130, 65, .75)
        }

        .pbtn.reload {
            background: rgba(0, 80, 120, .75)
        }

        .pbtn.mx,
        .pbtn.ext {
            background: rgba(45, 45, 45, .8)
        }

        #hint {
            position: absolute;
            left: 10px;
            bottom: 12px;
            right: 10px;
            z-index: 1005;
            background: rgba(0, 0, 0, .72);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 10px 12px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            pointer-events: none
        }

        #player.show-controls #hint {
            opacity: 1
        }

        .centerPlay {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 1004;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 3px solid #fff;
            background: rgba(255, 255, 255, .85);
            color: #111;
            font-size: 34px;
            font-weight: 900;
            display: none;
            align-items: center;
            justify-content: center
        }

        .centerPlay.show {
            display: flex
        }

        .ep-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px
        }

        .ep-card {
            min-width: 110px;
            background: #111;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #222
        }

        .all-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            padding: 10px
        }

        .all-grid .card {
            min-width: 0;
            max-width: none;
            width: 100%
        }

        @media(min-width:700px) {
            .all-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr))
            }
        }

        @media(min-width:1100px) {
            .all-grid {
                grid-template-columns: repeat(6, minmax(0, 1fr))
            }
        }
    </style>
</head>

<body>
    <div id="grid"></div>
    <div id="overlay"></div>

    <div id="player">
        <div class="player-top">
            <div class="leftBtns">
                <button class="pbtn close" id="closeBtn">✕</button>
                <button class="pbtn reload" id="reloadBtn">↻ รีโหลด</button>
            </div>
            <div class="rightBtns">
                <button class="pbtn ext" id="deviceBtn">▶ PLAYER</button>
                <button class="pbtn mx" id="mxBtn">▶ MX</button>
                <button class="pbtn home" id="homeBtn">🏠 HOME</button>
            </div>
        </div>
        <button class="centerPlay" id="centerPlay">▶</button>
        <video id="video" playsinline webkit-playsinline x5-playsinline autoplay preload="auto"></video>
        <iframe id="frame" allowfullscreen referrerpolicy="no-referrer"></iframe>
        <div id="hint">กำลังเตรียมเล่น...</div>
    </div>

    <script>
        const PROXY="https://iptv.tawatchai250958.workers.dev/?url=";
const HOME_URL="https://tiea9999.github.io/tv-online/index.html";
const TEST_OKHD="https://ok-hd.com/hls/6553758273a9419011f8b92bec62fd62/master.m3u8";

const SOURCES=[
            {
            name: "EZ 18+",
            type: "json",
            url: "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/Vip.json",
            },
            {
            name: "njav 18+",
            type: "json",
            url: "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/njav.json",
            },
            {
            name: "avpung 18+",
            type: "json",
            url: "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/playlist_avpung.json",
            },
            {
            name: "jav24 18+",
            type: "json",
            url: "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/playlist_jav24.json",
            },
            {
            name: "pornxxx",
            type: "json",
            url: "https://raw.githubusercontent.com/tiea9999/tv-online/refs/heads/main/pornxxx.json",
            },
];

const FALLBACK_IMG="data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450"><rect width="100%" height="100%" fill="#1a1a1a"/><text x="50%" y="50%" fill="#ffffff" font-size="22" text-anchor="middle" dy=".3em">NO IMAGE</text></svg>`);

let grid=document.getElementById("grid");
let overlay=document.getElementById("overlay");
let player=document.getElementById("player");
let video=document.getElementById("video");
let frame=document.getElementById("frame");
let hint=document.getElementById("hint");
let centerPlay=document.getElementById("centerPlay");
let hls=null, store={}, currentList=[], currentIndex=0, currentUrl="", lastView={type:"grid",item:null}, controlsTimer=null, playWatchTimer=null;

function safeId(t){return String(t).replace(/[^\wก-๙-]/g,"_")}
function getTitle(i){return i?.title||i?.name||i?.ep_name||"ไม่มีชื่อ"}
function getImage(i){return i?.image||i?.poster||i?.poster_url||i?.thumb||i?.thumbnail||i?.logo||FALLBACK_IMG}
function getDirectUrl(i){return i?.url||i?.file||i?.src||i?.link||i?.stream||i?.play||i?.video||i?.video_url||i?.m3u8||i?.player||i?.embed||i?.stream_url||""}
function normalizeServers(x){
  if(!Array.isArray(x)) return [];
  return x.map(s=>{
    if(typeof s==="string") return {url:s};
    return {url:getDirectUrl(s||{})};
  }).filter(s=>s.url);
}
function getServers(item){
  let servers=normalizeServers(item?.servers||item?.sources||item?.links||item?.files||[]);
  let one=getDirectUrl(item||{});
  if(one) servers.unshift({url:one});
  let seen=new Set();
  return servers.filter(s=>{if(seen.has(s.url))return false;seen.add(s.url);return true});
}
function isHls(u){return /\.m3u8($|\?)/i.test(String(u||""))}
function isVideoFile(u){return /\.(mp4|m4v|webm|ogg|ogv|mov)($|\?)/i.test(String(u||""))}
function shouldProxy(u){
  u=String(u||"").toLowerCase();
  if(u.includes(".mpd"))return false;
  if(u.includes("thaicdn"))return false;
  if(u.includes("mux.dev"))return false;
  if(u.includes("byteark"))return false;
  return true;
}
function proxied(u){return shouldProxy(u)?PROXY+encodeURIComponent(u):u}
function setHint(t){hint.textContent=t}
function showControls(focusX=false){
  player.classList.add("show-controls");
  clearTimeout(controlsTimer);
  if(focusX)setTimeout(()=>document.getElementById("closeBtn").focus(),60);
  controlsTimer=setTimeout(()=>player.classList.remove("show-controls"),5000);
}
function requestFull(){
  try{if(player.requestFullscreen)player.requestFullscreen();else if(player.webkitRequestFullscreen)player.webkitRequestFullscreen()}catch(e){}
}
function cleanup(){
  clearTimeout(playWatchTimer);
  if(hls){try{hls.destroy()}catch(e){} hls=null}
  try{video.pause();video.removeAttribute("src");video.src="";video.load()}catch(e){}
  frame.src="about:blank"; frame.style.display="none"; video.style.display="block"; centerPlay.classList.remove("show");
}
function closePlayer(){
  cleanup();
  player.style.display="none";
  player.classList.remove("show-controls");
  try{if(document.fullscreenElement)document.exitFullscreen();else if(document.webkitFullscreenElement)document.webkitExitFullscreen()}catch(e){}
  if(lastView.type==="ep"&&lastView.item){showEP(lastView.item);return}
  overlay.style.display="none"; grid.style.display="block";
  setTimeout(()=>document.querySelector(".card")?.focus(),120);
}
async function loadAll(){
  grid.innerHTML='<div class="status">⚡ LOADING...</div>';
  grid.innerHTML="";
  for(const s of SOURCES){
    try{
      let list=[];
      if(Array.isArray(s.items)) list=s.items;
      else{
        let res=await fetch(s.url+"?t="+Date.now(),{cache:"no-store"});
        let data=await res.json();
        list=Array.isArray(data)?data:(Array.isArray(data.items)?data.items:(Array.isArray(data.data)?data.data:[]));
      }
      store[s.name]={data:list,error:""};
    }catch(e){store[s.name]={data:[],error:"โหลดรายการไม่ได้"}}
    renderRow(s.name);
  }
}
function renderRow(name){
  let row=document.createElement("div");
  row.innerHTML=`<div class="row-title"><span>${name}</span><button class="seeall" onclick="seeAll('${name.replace(/'/g,"\\'")}')">ดูทั้งหมด</button></div><div class="row-items" id="row-${safeId(name)}"></div>`;
  grid.appendChild(row); renderPage(name);
}
function createCard(item,onClick){
  let d=document.createElement("div"); d.className="card"; d.tabIndex=0;
  let img=getImage(item), title=getTitle(item);
  d.innerHTML=`<img src="${img}" alt="${title}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'"><div class="card-title">${title}</div>`;
  d.onclick=onClick;
  d.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onClick()}};
  return d;
}
function renderPage(name){
  let row=document.getElementById("row-"+safeId(name)), obj=store[name]; if(!row||!obj)return;
  row.innerHTML="";
  if(obj.error){row.innerHTML=`<div class="status">❌ ${obj.error}</div>`;return}
  obj.data.slice(0,15).forEach(item=>row.appendChild(createCard(item,()=>openItem(item))));
}
function seeAll(name){
  let obj=store[name]; if(!obj)return;
  overlay.style.display="block"; grid.style.display="none";
  overlay.innerHTML=`<div style="padding:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;"><h2>${name}</h2><button class="seeall" onclick="backToGrid()">← กลับ</button></div><div id="allBox" class="all-grid"></div>`;
  let box=document.getElementById("allBox");
  obj.data.forEach(item=>box.appendChild(createCard(item,()=>openItem(item))));
}
function backToGrid(){overlay.style.display="none";overlay.innerHTML="";grid.style.display="block"}
function openItem(item){
  if(Array.isArray(item.episodes)&&item.episodes.length){showEP(item);return}
  let servers=getServers(item);
  if(!servers.length){setHint("❌ ไม่พบลิงก์เล่น");showControls(true);return}
  startPlay(servers);
}
function showEP(item){
  lastView={type:"ep",item};
  overlay.style.display="block"; grid.style.display="none";
  overlay.innerHTML=`<div style="padding:10px;display:flex;align-items:center;justify-content:space-between;"><h2>${getTitle(item)}</h2><button class="seeall" onclick="backToGrid()">← กลับ</button></div><div class="ep-wrap" id="epBox"></div>`;
  let box=document.getElementById("epBox");
  item.episodes.forEach((ep,i)=>{
    let d=document.createElement("div"); d.className="ep-card"; d.tabIndex=0; d.textContent=ep.name||ep.title||`EP ${i+1}`;
    let fn=()=>{let sv=getServers(ep); if(sv.length)startPlay(sv); else {setHint("❌ ตอนนี้ไม่มีลิงก์เล่น");showControls(true)}};
    d.onclick=fn; d.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fn()}};
    box.appendChild(d);
  });
}
function startPlay(list){
  currentList=list.filter(s=>s&&s.url); currentIndex=0;
  if(!currentList.length)return;
  overlay.style.display="none"; player.style.display="block"; video.style.display="block"; frame.style.display="none";
  showControls(true); requestFull(); playCurrent();
}
function playCurrent(){
  let s=currentList[currentIndex];
  if(!s){webFailed();return}
  currentUrl=s.url;
  tryPlayChain(currentUrl).catch(()=>{currentIndex++;playCurrent()});
}
async function tryPlayChain(url){
  if(isHls(url)){
    try{await playHls(url,false);return}catch(e){}
    try{await playHls(url,true);return}catch(e){}
    throw "hls failed";
  }
  if(isVideoFile(url)){await playNative(url);return}
  frame.style.display="block"; video.style.display="none"; frame.src=url; setHint("เปิด iframe แล้ว"); return;
}
function playHls(url,useProxy){
  cleanup(); currentUrl=url; video.style.display="block";
  let src=useProxy?proxied(url):url;
  setHint(useProxy?"ลองผ่าน proxy...":"ลองลิงก์ตรง...");
  return new Promise((resolve,reject)=>{
    let settled=false;
    function ok(){
      if(settled)return; settled=true; clearTimeout(playWatchTimer); clearAll();
      video.muted=false; video.volume=1;
      video.play().then(()=>{setHint("เล่นผ่านเว็บแล้ว");resolve()}).catch(()=>{centerPlay.classList.add("show");setHint("กดปุ่ม ▶ กลางจอ เพื่อเริ่มเล่น");resolve()});
    }
    function fail(){
      if(settled)return; settled=true; clearTimeout(playWatchTimer); clearAll(); reject("fail");
    }
    function clearAll(){
      video.removeEventListener("loadedmetadata",ok);video.removeEventListener("canplay",ok);video.removeEventListener("playing",ok);video.removeEventListener("error",fail);
    }
    video.addEventListener("loadedmetadata",ok,{once:true});
    video.addEventListener("canplay",ok,{once:true});
    video.addEventListener("playing",ok,{once:true});
    video.addEventListener("error",fail,{once:true});
    if(Hls.isSupported()){
      hls=new Hls({
        enableWorker:false, lowLatencyMode:false, backBufferLength:10, maxBufferLength:18, maxMaxBufferLength:36,
        startLevel:-1, capLevelToPlayerSize:true, testBandwidth:false,
        fragLoadingTimeOut:30000, manifestLoadingTimeOut:30000, levelLoadingTimeOut:30000,
        fragLoadingMaxRetry:4, manifestLoadingMaxRetry:3, levelLoadingMaxRetry:3
      });
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{try{video.muted=true;video.play().catch(()=>{})}catch(e){}});
      hls.on(Hls.Events.ERROR,(ev,data)=>{
        if(data&&data.fatal){
          if(data.type===Hls.ErrorTypes.NETWORK_ERROR){try{hls.startLoad()}catch(e){}}
          else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError()}catch(e){}}
          else fail();
        }
      });
      hls.loadSource(src); hls.attachMedia(video);
    }else if(video.canPlayType("application/vnd.apple.mpegurl")){
      video.src=src; video.load(); video.muted=true; video.play().catch(()=>{});
    }else reject("no hls");
    playWatchTimer=setTimeout(()=>{ if(!settled) fail() }, /ok-hd\.com/i.test(url)?18000:10000);
  });
}
function playNative(url){
  cleanup(); video.style.display="block"; video.src=url; video.muted=false; video.volume=1; setHint("เล่นไฟล์วิดีโอ...");
  return video.play();
}
function webFailed(){
  setHint("เว็บเล่นไม่ได้ในโปรเจ็คเตอร์นี้ กด ▶ PLAYER หรือ ▶ MX เพื่อเล่นลิงก์ตรง");
  showControls(true);
  centerPlay.classList.add("show");
}
function buildIntent(url,type,pkg){
  let scheme=url.startsWith("https://")?"https":"http", clean=url.replace(/^https?:\/\//,""), fallback=encodeURIComponent(url);
  return `intent://${clean}#Intent;scheme=${scheme};action=android.intent.action.VIEW;${pkg?`package=${pkg};`:""}type=${type};S.browser_fallback_url=${fallback};end`;
}
function openDevicePlayer(){
  if(!currentUrl)return;
  window.location.href=buildIntent(currentUrl,isHls(currentUrl)?"application/x-mpegURL":"video/*","");
}
function openMx(){
  if(!currentUrl)return;
  window.location.href=buildIntent(currentUrl,isHls(currentUrl)?"application/x-mpegURL":"video/*","com.mxtech.videoplayer.ad");
}
function seekVideo(sec){
  showControls();
  if(video.style.display==="none")return;
  video.currentTime=Math.max(0,(video.currentTime||0)+sec);
}
document.getElementById("closeBtn").onclick=closePlayer;
document.getElementById("reloadBtn").onclick=()=>{if(currentUrl)playCurrent()};
document.getElementById("deviceBtn").onclick=openDevicePlayer;
document.getElementById("mxBtn").onclick=openMx;
document.getElementById("homeBtn").onclick=()=>location.href=HOME_URL;
centerPlay.onclick=()=>{video.muted=false;video.volume=1;video.play().then(()=>centerPlay.classList.remove("show")).catch(()=>{})};
player.addEventListener("mousemove",()=>showControls());
player.addEventListener("click",()=>showControls());
player.addEventListener("touchstart",()=>showControls());
document.addEventListener("keydown",e=>{
  if(player.style.display==="block"){
    showControls(true);
    if(e.key==="ArrowLeft"){e.preventDefault();seekVideo(-10)}
    else if(e.key==="ArrowRight"){e.preventDefault();seekVideo(10)}
    else if(e.key==="Enter"||e.key==="OK"){requestFull()}
    else if(e.key==="Escape"||e.key==="Backspace"||e.keyCode===10009){e.preventDefault();closePlayer()}
  }
});
loadAll();
    </script>
</body>

</html>
