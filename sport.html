<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TIEA SPORT TS PROXY DIRECT FILE</title>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
.topbar{display:flex;gap:8px;align-items:center;padding:10px;background:#111;border-bottom:1px solid #333;flex-wrap:wrap}
.btn{background:#222;color:#fff;border:2px solid #555;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}
.btn:focus,.btn:hover{outline:none;border-color:orange;box-shadow:0 0 0 4px cyan}
.title{color:orange;font-size:18px;font-weight:900;flex:1;min-width:180px}
.status{color:#9ff;font-size:13px;padding:8px 10px;background:#050505;border-bottom:1px solid #222}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:10px;overflow:auto;flex:1}
.card{background:#222;border:2px solid #444;border-radius:12px;padding:8px;text-align:center;cursor:pointer;color:#fff}
.card img{width:70px;height:70px;object-fit:contain}
.card:focus,.card:hover{outline:none;border-color:orange;box-shadow:0 0 0 4px cyan}
#playerBox{position:fixed;inset:0;background:#000;z-index:9999;display:none}
#video{width:100%;height:100%;background:#000}
.controls{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;z-index:10000;transition:.25s}
#playerBox.hide .controls,#playerBox.hide #playStatus{opacity:0;visibility:hidden;pointer-events:none}
#playStatus{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.72);border:1px solid #077;padding:9px;border-radius:10px;text-align:center;z-index:10000;transition:.25s}
@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}.btn{font-size:12px;padding:8px}.card img{width:52px;height:52px}.card{font-size:11px}}
</style>
</head>
<body>
<div class="topbar">
  <button class="btn" onclick="location.href='index.html'">🏠 HOME</button>
  <div class="title">TIEA SPORT TS PROXY DIRECT FILE</div>
  <button class="btn" onclick="location.reload()">↻ โหลดใหม่</button>
</div>
<div class="status" id="status">พร้อมใช้งาน • TS จะเล่นผ่าน Proxy เฉพาะ</div>
<div class="grid" id="list"></div>

<div id="playerBox">
  <div class="controls">
    <div>
      <button class="btn" id="closeBtn" onclick="closePlayer()">X</button>
      <button class="btn" onclick="restart()">↻ รีโหลด</button>
    </div>
    <div>
      <button class="btn" onclick="openDirect()">▶ เปิดตรง</button>
      <button class="btn" onclick="location.href='index.html'">🏠 HOME</button>
    </div>
  </div>
  <video id="video" controls autoplay playsinline webkit-playsinline></video>
  <div id="playStatus">กำลังโหลด...</div>
</div>

<script>
const TS_PROXY = "https://iptv.tawatchai250958.workers.dev/?url=";

const channels = [
  {
    name:"testดูบอล TS",
    logo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRuwAjENpDBsnhb91rzlQxF39KqlCZxHqHVig&s",
    url:"http://195.128.27.141:80/rmt8r91bac/tsleey7v5g/1776175.ts",
    type:"ts"
  },
  {
    name:"Explife HLS",
    logo:"https://api.bananamuffin.org/images/png/sd-explife.png",
    url:"https://love.sikoyo3159.workers.dev/vx-origin/epl-bein1_720/chunks.m3u8",
    type:"hls"
  }
];

let player = null;
let hls = null;
let current = null;
let watchdog = null;
let uiTimer = null;

const video = document.getElementById("video");
const box = document.getElementById("playerBox");
const playStatus = document.getElementById("playStatus");

function setStatus(t){document.getElementById("status").textContent=t}
function setPlayStatus(t){playStatus.textContent=t}
function forceAudio(){try{video.muted=false;video.defaultMuted=false;video.volume=1.0}catch(e){}}

function proxy(url){
  return TS_PROXY + encodeURIComponent(url);
}

function destroyAll(){
  if(watchdog){clearInterval(watchdog);watchdog=null}
  if(player){
    try{player.pause&&player.pause()}catch(e){}
    try{player.unload&&player.unload()}catch(e){}
    try{player.detachMediaElement&&player.detachMediaElement()}catch(e){}
    try{player.destroy&&player.destroy()}catch(e){}
    player=null;
  }
  if(hls){try{hls.destroy()}catch(e){}hls=null}
  try{video.pause();video.removeAttribute("src");video.load()}catch(e){}
}

function playChannel(ch){
  current = ch;
  box.style.display = "block";
  showUI();
  destroyAll();

  if(ch.type === "hls" || ch.url.toLowerCase().includes(".m3u8")){
    playHls(ch.url);
  }else{
    playTs(ch.url);
  }

  setTimeout(()=>document.getElementById("closeBtn").focus(),200);
}

function playHls(url){
  setPlayStatus("กำลังโหลด HLS...");
  if(Hls.isSupported()){
    hls = new Hls({
      enableWorker:false,
      lowLatencyMode:false,
      maxBufferLength:120,
      maxMaxBufferLength:180,
      backBufferLength:60,
      maxBufferHole:2.5,
      manifestLoadingMaxRetry:10,
      levelLoadingMaxRetry:10,
      fragLoadingMaxRetry:12,
      manifestLoadingRetryDelay:2000,
      levelLoadingRetryDelay:2000,
      fragLoadingRetryDelay:2000,
      capLevelToPlayerSize:true,
      testBandwidth:false,
      abrEwmaDefaultEstimate:700000,
      liveSyncDurationCount:5,
      liveMaxLatencyDurationCount:12
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      forceAudio();
      video.play().catch(()=>{});
      setPlayStatus("กำลังเล่น HLS");
    });
  }else{
    video.src = url;
    video.play().catch(()=>{});
  }
}

function playTs(rawUrl){
  if(!window.mpegts || !mpegts.getFeatureList().mseLivePlayback){
    setPlayStatus("เครื่องนี้ไม่รองรับ TS ในเว็บ");
    return;
  }

  let routes = [
    {name:"Proxy", url:proxy(rawUrl)},
    {name:"Direct", url:rawUrl}
  ];

  let routeIndex = 0;
  let reconnecting = false;
  let playedOnce = false;

  function make(){
    if(player){
      try{player.pause&&player.pause()}catch(e){}
      try{player.unload&&player.unload()}catch(e){}
      try{player.detachMediaElement&&player.detachMediaElement()}catch(e){}
      try{player.destroy&&player.destroy()}catch(e){}
      player=null;
    }

    try{video.pause();video.removeAttribute("src");video.load()}catch(e){}

    const route = routes[routeIndex];
    setPlayStatus("กำลังโหลด TS ผ่าน " + route.name + "...");

    player = mpegts.createPlayer({
      type:"mpegts",
      isLive:true,
      url:route.url,
      cors:true,
      withCredentials:false
    },{
      enableWorker:false,
      enableStashBuffer:true,
      stashInitialSize:1024*1024,
      lazyLoad:false,
      deferLoadAfterSourceOpen:false,
      autoCleanupSourceBuffer:true,
      autoCleanupMaxBackwardDuration:60,
      autoCleanupMinBackwardDuration:20,
      liveBufferLatencyChasing:true,
      liveBufferLatencyMaxLatency:8,
      liveBufferLatencyMinRemain:2,
      fixAudioTimestampGap:true,
      accurateSeek:false
    });

    player.attachMediaElement(video);
    player.load();

    const tryPlay=()=>{
      forceAudio();
      video.play().then(()=>{
        playedOnce = true;
        setPlayStatus("กำลังเล่น TS ผ่าน " + route.name);
      }).catch(()=>{
        setPlayStatus("กด ▶ บนจอ 1 ครั้ง ถ้าเครื่องบล็อก autoplay");
      });
    };

    setTimeout(tryPlay,700);
    setTimeout(tryPlay,2000);
    setTimeout(tryPlay,4000);

    player.on(mpegts.Events.ERROR,(type,detail,info)=>{
      console.log("MPEGTS ERROR",type,detail,info);
      if(!playedOnce && routeIndex + 1 < routes.length){
        routeIndex++;
        setTimeout(make,1000);
      }else{
        setPlayStatus("TS สะดุด กำลังต่อใหม่...");
        setTimeout(make,1800);
      }
    });
  }

  make();

  let last=0,stuck=0,noData=0;
  watchdog=setInterval(()=>{
    if(box.style.display !== "block"){clearInterval(watchdog);watchdog=null;return}
    forceAudio();
    if(video.paused)video.play().catch(()=>{});
    if(video.readyState < 2){noData++;setPlayStatus("กำลังรอสัญญาณ TS...")}else noData=0;
    if(Math.abs((video.currentTime||0)-last)<0.05)stuck++;else stuck=0;
    last=video.currentTime||0;
    if((noData>=10 || stuck>=12) && !reconnecting){
      reconnecting=true;
      setPlayStatus("TS ค้าง กำลังต่อใหม่...");
      setTimeout(()=>{make();reconnecting=false},1800);
      noData=0;stuck=0;
    }
  },3000);
}

function restart(){ if(current) playChannel(current); }
function closePlayer(){ destroyAll(); box.style.display="none"; }
function openDirect(){ if(current) window.location.href=current.url; }

function showUI(){
  box.classList.remove("hide");
  if(uiTimer) clearTimeout(uiTimer);
  uiTimer=setTimeout(()=>{if(box.style.display==="block")box.classList.add("hide")},3000);
}
["mousemove","mousedown","touchstart","touchmove","click","pointermove","pointerdown"].forEach(e=>box.addEventListener(e,showUI,{passive:true}));
document.addEventListener("keydown",e=>{
  if(box.style.display==="block"){
    showUI();
    if(e.key==="Escape"||e.key==="Backspace"||e.key==="BrowserBack"||e.keyCode===10009){
      e.preventDefault();
      closePlayer();
    }
  }
});

function render(){
  const list=document.getElementById("list");
  channels.forEach(ch=>{
    const d=document.createElement("div");
    d.className="card";
    d.tabIndex=0;
    d.innerHTML=`<img src="${ch.logo}" onerror="this.style.display='none'"><div>${ch.name}</div>`;
    d.onclick=()=>playChannel(ch);
    d.onkeydown=e=>{if(e.key==="Enter"||e.key==="OK"||e.key===" "){e.preventDefault();playChannel(ch)}};
    list.appendChild(d);
  });
  setTimeout(()=>document.querySelector(".card")?.focus(),200);
}
render();
</script>
</body>
</html>
