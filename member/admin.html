<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TIEA Admin</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050505;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:100%;max-width:440px;background:#111;border:1px solid #333;border-radius:20px;padding:24px;box-shadow:0 0 35px rgba(0,200,255,.13)}
.logo{text-align:center;font-size:28px;font-weight:900;color:#00e5ff;margin-bottom:8px}.sub{text-align:center;color:#bbb;line-height:1.5;margin-bottom:18px}
label{display:block;margin:12px 0 6px;font-weight:700}input{width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#050505;color:#fff;font-size:16px}
button,.btn{width:100%;display:block;text-align:center;margin-top:14px;padding:14px;border-radius:999px;border:0;background:linear-gradient(90deg,#00c6ff,#0072ff);color:#fff;font-size:16px;font-weight:900;text-decoration:none;cursor:pointer}
.secondary{background:#222!important;border:1px solid #444}.danger{background:#4b1111!important}.msg{margin-top:14px;text-align:center;color:#ffcc66;white-space:pre-wrap;line-height:1.5}.ok{color:#72ff9a}.bad{color:#ff7676}.small{text-align:center;color:#aaa;margin-top:14px;font-size:13px;line-height:1.5}
.wrap{max-width:980px;width:100%}.admin-card{max-width:980px}table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}th,td{border-bottom:1px solid #333;padding:9px;text-align:left}
.badge{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:900}.vip{background:#124d20;color:#83ff9b}.wait{background:#513b06;color:#ffd36e}
</style></head><body>
<div class="wrap"><div class="card admin-card"><div class="logo">Admin สมาชิก</div><div class="sub" id="adminInfo">กำลังตรวจสอบ...</div><button onclick="loadMembers()">↻ โหลดสมาชิก</button><button class="secondary" onclick="logout()">ออกจากระบบ</button><div id="msg" class="msg"></div><div style="overflow:auto"><table><thead><tr><th>อีเมล</th><th>ชื่อ</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),rows=document.getElementById("rows"),msg=document.getElementById("msg");let adminUser=null;
function show(t,ok=false){msg.textContent=t;msg.className=ok?"msg ok":"msg bad"}
onAuthStateChanged(auth,async user=>{if(!user)return location.href="login.html";const snap=await getDoc(doc(db,"members",user.uid));if(!snap.exists()||snap.data().role!=="admin"){document.body.innerHTML="<div style='background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial'>หน้านี้สำหรับแอดมินเท่านั้น</div>";return;}adminUser=user;document.getElementById("adminInfo").textContent="แอดมิน: "+user.email;loadMembers();});
window.loadMembers=async()=>{rows.innerHTML="<tr><td colspan='4'>กำลังโหลด...</td></tr>";const snap=await getDocs(collection(db,"members"));rows.innerHTML="";snap.forEach(d=>{const m=d.data(),st=m.role==="admin"?"ADMIN":(m.vip||m.active?"VIP":"รออนุมัติ"),cls=(m.vip||m.active||m.role==="admin")?"vip":"wait";const tr=document.createElement("tr");tr.innerHTML=`<td>${m.email||"-"}</td><td>${m.name||"-"}</td><td><span class="badge ${cls}">${st}</span></td><td><button style="padding:8px;margin:2px" onclick="setVip('${d.id}',true)">เปิด VIP</button><button class="danger" style="padding:8px;margin:2px" onclick="setVip('${d.id}',false)">ปิด VIP</button></td>`;rows.appendChild(tr);});}
window.setVip=async(uid,value)=>{await updateDoc(doc(db,"members",uid),{vip:value,active:value,approvedAt:value?serverTimestamp():null});show(value?"เปิด VIP แล้ว":"ปิด VIP แล้ว",true);loadMembers();}
window.logout=async()=>{await signOut(auth);location.href="login.html";}
</script></body></html>
